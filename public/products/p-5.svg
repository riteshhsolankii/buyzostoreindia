<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#a428d8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#a428d8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lime" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2e6ff2"/>
      <stop offset="100%" stop-color="#ef2f8f"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2e6ff2" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#2e6ff2" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="600" height="450" fill="#f5f6fb"/>
  <rect width="600" height="450" fill="url(#glow)"/>
  <!-- light beam -->
  <path d="M330 150 L260 340 h180 z" fill="url(#beam)"/>
  <!-- head -->
  <rect x="278" y="118" width="130" height="34" rx="17" fill="#222" stroke="#3a3a3a" stroke-width="2" transform="rotate(-18 343 135)"/>
  <rect x="292" y="140" width="96" height="8" rx="4" fill="url(#lime)" transform="rotate(-18 340 144)"/>
  <!-- arm -->
  <path d="M292 150 L216 258" stroke="#2c2c2c" stroke-width="12" stroke-linecap="round"/>
  <path d="M216 258 L216 330" stroke="#2c2c2c" stroke-width="12" stroke-linecap="round"/>
  <circle cx="216" cy="258" r="10" fill="#1a1a1a" stroke="url(#lime)" stroke-width="2.5"/>
  <circle cx="292" cy="150" r="9" fill="#1a1a1a" stroke="#3a3a3a" stroke-width="2"/>
  <!-- base with charging pad -->
  <rect x="150" y="330" width="180" height="22" rx="11" fill="#222" stroke="#3a3a3a" stroke-width="2"/>
  <ellipse cx="286" cy="341" rx="26" ry="7" fill="none" stroke="url(#lime)" stroke-width="2.5"/>
  <!-- phone on pad -->
  <rect x="266" y="312" width="40" height="22" rx="5" fill="#161616" stroke="#333" stroke-width="1.5"/>
  <circle cx="286" cy="323" r="4" fill="#a428d8"/>
  <circle cx="430" cy="150" r="4.5" fill="#2e6ff2"/>
  <circle cx="452" cy="290" r="3" fill="#ef2f8f"/>
</svg>
