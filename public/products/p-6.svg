<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450">
  <defs>
    <radialGradient id="glow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#b8dd26" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#b8dd26" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lime" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e9ef35"/>
      <stop offset="100%" stop-color="#8cc414"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#16210a"/>
      <stop offset="100%" stop-color="#0d0d0d"/>
    </linearGradient>
  </defs>
  <rect width="600" height="450" fill="#101010"/>
  <rect width="600" height="450" fill="url(#glow)"/>
  <!-- screen -->
  <rect x="120" y="90" width="360" height="220" rx="16" fill="#1d1d1d" stroke="#3a3a3a" stroke-width="2"/>
  <rect x="132" y="102" width="336" height="196" rx="8" fill="url(#screen)"/>
  <!-- wallpaper: abstract lime waves -->
  <path d="M132 250 q60 -60 130 -20 t 206 -40 v108 h-336 z" fill="#b8dd26" opacity="0.25"/>
  <path d="M132 268 q80 -50 150 -14 t 186 -30 v74 h-336 z" fill="url(#lime)" opacity="0.5"/>
  <circle cx="404" cy="150" r="26" fill="url(#lime)" opacity="0.9"/>
  <!-- 4K badge -->
  <rect x="150" y="118" width="64" height="26" rx="13" fill="#0a0a0a" stroke="url(#lime)" stroke-width="2"/>
  <text x="182" y="136" text-anchor="middle" fill="#e9ef35" font-family="Arial, sans-serif" font-size="14" font-weight="bold">4K</text>
  <!-- stand -->
  <path d="M280 310 h40 l8 44 h-56 z" fill="#222"/>
  <rect x="230" y="354" width="140" height="14" rx="7" fill="#2a2a2a" stroke="#3a3a3a" stroke-width="1.5"/>
  <circle cx="470" cy="70" r="4" fill="#e9ef35"/>
  <circle cx="128" cy="340" r="3.5" fill="#8cc414"/>
</svg>
