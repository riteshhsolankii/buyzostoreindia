<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#a428d8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#a428d8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lime" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2e6ff2"/>
      <stop offset="100%" stop-color="#ef2f8f"/>
    </linearGradient>
  </defs>
  <rect width="600" height="450" fill="#f5f6fb"/>
  <rect width="600" height="450" fill="url(#glow)"/>
  <circle cx="300" cy="230" r="150" fill="none" stroke="#e2e6f0" stroke-width="1.5"/>
  <!-- body -->
  <path d="M300 110 c62 0 92 52 92 128 0 74 -38 116 -92 116 s-92 -42 -92 -116 c0 -76 30 -128 92 -128z" fill="#212121" stroke="#3a3a3a" stroke-width="2"/>
  <!-- split line -->
  <path d="M300 112 v96" stroke="#3a3a3a" stroke-width="2"/>
  <!-- accent side stripe -->
  <path d="M215 190 c-4 90 24 150 78 162 -66 4 -102 -60 -78 -162z" fill="url(#lime)" opacity="0.9"/>
  <!-- scroll wheel -->
  <rect x="290" y="146" width="20" height="44" rx="10" fill="#0d0d0d" stroke="url(#lime)" stroke-width="2"/>
  <rect x="297" y="156" width="6" height="24" rx="3" fill="#a428d8"/>
  <!-- dpi button -->
  <rect x="292" y="208" width="16" height="10" rx="4" fill="#333"/>
  <!-- signal waves -->
  <path d="M394 140 a56 56 0 0 1 0 60" fill="none" stroke="#a428d8" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
  <path d="M412 122 a84 84 0 0 1 0 96" fill="none" stroke="#a428d8" stroke-width="4" stroke-linecap="round" opacity="0.4"/>
  <circle cx="452" cy="320" r="4" fill="#2e6ff2"/>
  <circle cx="150" cy="130" r="3.5" fill="#ef2f8f"/>
</svg>
